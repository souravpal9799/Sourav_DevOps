<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MongoDB Replica Set Visualization</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .quick-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 10px 20px;
            background: white;
            color: #667eea;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            text-decoration: none;
            display: inline-block;
            transition: transform 0.2s;
        }
        
        .btn:hover {
            transform: scale(1.05);
        }
        
        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .card h2 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.5em;
        }
        
        .replica-set-members {
            display: grid;
            gap: 15px;
        }
        
        .member {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 5px;
            border-left: 4px solid #667eea;
        }
        
        .member.primary {
            border-left-color: #10b981;
            background: #f0fdf4;
        }
        
        .member.secondary {
            border-left-color: #3b82f6;
            background: #f0f9ff;
        }
        
        .member.arbiter {
            border-left-color: #f59e0b;
            background: #fffbf0;
        }
        
        .member-name {
            font-weight: bold;
            font-size: 1.1em;
            margin-bottom: 5px;
        }
        
        .status {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 3px;
            font-size: 0.85em;
            font-weight: bold;
            margin-top: 5px;
        }
        
        .status.up {
            background: #10b981;
            color: white;
        }
        
        .status.down {
            background: #ef4444;
            color: white;
        }
        
        .status-info {
            font-size: 0.9em;
            color: #666;
            margin-top: 8px;
        }
        
        .error {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 5px;
            border-left: 4px solid #c33;
        }
        
        .loading {
            text-align: center;
            color: #999;
            padding: 20px;
        }
        
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }
        
        .stat-row:last-child {
            border-bottom: none;
        }
        
        .stat-label {
            color: #666;
            font-weight: 500;
        }
        
        .stat-value {
            color: #333;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔄 MongoDB Replica Set Visualization</h1>
            <p>Real-time monitoring of your replica set cluster</p>
        </div>
        
        <div class="quick-links">
            <a href="http://localhost:8081" class="btn">📊 Mongo Express</a>
            <button class="btn" onclick="refreshData()">🔄 Refresh</button>
            <button class="btn" onclick="autoRefresh()">⏱️ Auto Refresh</button>
        </div>
        
        <div class="cards">
            <div class="card">
                <h2>🔗 Replica Set Status</h2>
                <div id="rs-status" class="loading">
                    <div class="spinner"></div> Loading...
                </div>
            </div>
            
            <div class="card">
                <h2>📈 Cluster Statistics</h2>
                <div id="cluster-stats" class="loading">
                    <div class="spinner"></div> Loading...
                </div>
            </div>
        </div>
        
        <div class="card">
            <h2>👥 Replica Set Members</h2>
            <div id="members" class="loading">
                <div class="spinner"></div> Loading...
            </div>
        </div>
    </div>
    
    <script>
        let autoRefreshInterval;
        
        async function fetchRSStatus() {
            try {
                const response = await fetch('/api/rs-status');
                const data = await response.json();
                
                if (data.error) {
                    showError('rs-status', data.error);
                    return;
                }
                
                displayRSStatus(data.status, data.config);
            } catch (error) {
                showError('rs-status', error.message);
            }
        }
        
        function displayRSStatus(status, config) {
            const set = status.set;
            const term = status.term || 'N/A';
            const myIndex = status.myState;
            const states = ['STARTUP', 'PRIMARY', 'SECONDARY', 'RECOVERING', 'FATAL', 'STARTUP2', 'UNKNOWN', 'ARBITER', 'DOWN', 'ROLLBACK', 'REMOVED'];
            const myState = states[myIndex] || 'UNKNOWN';
            
            const statusHtml = `
                <div class="stat-row">
                    <span class="stat-label">Replica Set Name:</span>
                    <span class="stat-value">${set}</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">Current Term:</span>
                    <span class="stat-value">${term}</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">My State:</span>
                    <span class="stat-value">${myState}</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">Members Count:</span>
                    <span class="stat-value">${status.members.length}</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">Healthy Members:</span>
                    <span class="stat-value">${status.members.filter(m => m.health === 1).length}</span>
                </div>
            `;
            
            document.getElementById('rs-status').innerHTML = statusHtml;
            displayMembers(status.members, config.config.members);
        }
        
        function displayMembers(members, configMembers) {
            const membersHtml = members.map(member => {
                const configMember = configMembers.find(c => c.host === member.name) || {};
                const state = getStateName(member.state);
                const stateClass = state.includes('PRIMARY') ? 'primary' : state.includes('SECONDARY') ? 'secondary' : state.includes('ARBITER') ? 'arbiter' : '';
                const health = member.health === 1 ? 'up' : 'down';
                
                return `
                    <div class="member ${stateClass}">
                        <div class="member-name">
                            ${member.name}
                            ${configMember.priority === 0 ? ' <small>(Passive)</small>' : configMember.arbiterOnly ? ' <small>(Arbiter)</small>' : ''}
                        </div>
                        <div class="status ${health}">
                            ${health === 'up' ? '✓ Healthy' : '✗ Down'}
                        </div>
                        <div class="status-info">
                            State: <strong>${state}</strong><br>
                            Uptime: <strong>${member.uptime || 'N/A'} seconds</strong><br>
                            Latency: <strong>${member.electionTime ? '...' : 'N/A'}</strong>
                        </div>
                    </div>
                `;
            }).join('');
            
            document.getElementById('members').innerHTML = membersHtml;
            
            // Count stats
            const clusterStatsHtml = `
                <div class="stat-row">
                    <span class="stat-label">Total Members:</span>
                    <span class="stat-value">${members.length}</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">Primary Nodes:</span>
                    <span class="stat-value">${members.filter(m => m.state === 1).length}</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">Secondary Nodes:</span>
                    <span class="stat-value">${members.filter(m => m.state === 2).length}</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">Arbiter Nodes:</span>
                    <span class="stat-value">${members.filter(m => m.state === 7).length}</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">Healthy Nodes:</span>
                    <span class="stat-value">${members.filter(m => m.health === 1).length}/${members.length}</span>
                </div>
            `;
            
            document.getElementById('cluster-stats').innerHTML = clusterStatsHtml;
        }
        
        function getStateName(state) {
            const states = {
                0: 'STARTUP',
                1: 'PRIMARY',
                2: 'SECONDARY',
                3: 'RECOVERING',
                4: 'FATAL',
                5: 'STARTUP2',
                6: 'UNKNOWN',
                7: 'ARBITER',
                8: 'DOWN',
                9: 'ROLLBACK'
            };
            return states[state] || 'UNKNOWN';
        }
        
        function showError(elementId, error) {
            document.getElementById(elementId).innerHTML = `<div class="error">Error: ${error}</div>`;
        }
        
        function refreshData() {
            fetchRSStatus();
        }
        
        function autoRefresh() {
            if (autoRefreshInterval) {
                clearInterval(autoRefreshInterval);
                autoRefreshInterval = null;
                alert('Auto-refresh disabled');
            } else {
                fetchRSStatus();
                autoRefreshInterval = setInterval(fetchRSStatus, 5000);
                alert('Auto-refresh enabled (every 5 seconds)');
            }
        }
        
        // Initial load
        fetchRSStatus();
    </script>
</body>
</html>
